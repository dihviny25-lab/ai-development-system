name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Required files, tracked secret files, Markdown links, agent contracts,
      # command/README parity, and profile structure. Run locally with the same command.
      - name: Validate protocol structure and contracts
        run: python3 scripts/validate.py

  adoption-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Smoke test adoption into an empty repository
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"

          # Dry run must not write anything.
          scripts/adopt.sh --level 4 "$target"
          test -z "$(find "$target" -type f)"

          scripts/adopt.sh --level 4 --adapters --profile typescript-supabase-vercel --apply "$target"
          test -f "$target/AGENTS.md"
          test -f "$target/agents/orchestrator.md"
          test -f "$target/.claude/commands/ads-feature.md"
          test -f "$target/.cursor/rules/ai-development-system.mdc"

          # Existing files must never be overwritten.
          echo "project-specific rules" > "$target/AGENTS.md"
          scripts/adopt.sh --level 4 --apply "$target"
          grep -qx "project-specific rules" "$target/AGENTS.md"
